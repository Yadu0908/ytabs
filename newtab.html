<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>

    <!-- ── SHORTCUTS ───────────────────────────────── -->
    <div class="container">
      <div id="shortcuts-grid" class="shortcuts-grid"></div>
    </div>



    <!-- ── SHORTCUT MODAL ──────────────────────────── -->
    <div id="modal-overlay" class="modal-overlay hidden">
      <div class="modal-box">
        <h3>Edit shortcut</h3>
        <div class="modal-field">
          <label>Name</label>
          <input type="text" id="modal-name" autocomplete="off" />
        </div>
        <div class="modal-field">
          <label>URL</label>
          <input type="url" id="modal-url" autocomplete="off" />
        </div>
        <div class="modal-actions">
          <button id="modal-delete" class="btn-flat btn-danger">Remove</button>
          <div class="right-btns">
            <button id="modal-cancel" class="btn-stroke">Cancel</button>
            <button id="modal-save" class="btn-solid">Done</button>
          </div>
        </div>
      </div>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
