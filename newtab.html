<!DOCTYPE html>
<html lang="en" data-accent="blue">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <script src="js/theme-init.js"></script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/icons/titleIcon.png">
    <!-- Styles -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/layout.css">
</head>
<body>

    <main class="app-container">
        <!-- 1. Top Search Bar -->
        <section class="search-section">
            <div class="search-bar">
                <span class="search-icon">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </span>
                <input type="text" id="search-input" placeholder="Search bookmark..." autocomplete="off">
            </div>
            <ul id="search-suggestions" class="search-suggestions"></ul>
        </section>

        <!-- 2. Centered Clock -->
        <section class="clock-section">
            <h1 id="clock-time">00:00:00</h1>
            <p id="clock-date">Monday, Jan 1</p>
        </section>

        <!-- 3. Dashboard Grid -->
        <div class="dashboard-grid">
            <!-- Left: Tasks -->
             <section class="card task-card">
                <div class="card-header">
                    <h3>Focus Tasks</h3>

                </div>

                <ul id="task-list" class="task-list"></ul>

                <!-- Streak Counter MUST be here -->

                <!-- (Add Button is injected automatically by JS) -->
            </section>

            <!-- Right: Stats -->
            <section class="card stats-card">
                <h3>Activity (Last 24h)</h3>
                <div class="stats-placeholder"></div>
            </section>
        </div>

        <!-- 4. Shortcuts Grid -->
        <section class="shortcuts-section">
            <div id="shortcuts-grid" class="shortcuts-grid"></div>
        </section>

        <!-- 5. Bottom Quote -->
        <section class="quote-section">
            <p id="quote-text">"Simplicity is the soul of efficiency."</p>
        </section>
    </main>

    <!-- Theme Sidebar -->
    <aside class="theme-sidebar">
        <!-- Light/Dark/Auto Toggle -->
        <button id="mode-toggle" class="mode-btn" title="Auto (follow system)">
            <svg class="sun-icon" width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg class="moon-icon" width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            <svg class="auto-icon" width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"/>
                <polyline points="1 20 1 14 7 14"/>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
            </svg>
        </button>

        <div class="divider"></div>

        <!-- 10 Material Colors -->
        <div class="theme-palette">
            <button class="theme-dot" data-set-accent="blue" title="Blue" style="--dot-bg: #1f1f1f; --dot-card: #2d2d2d; --dot-accent: #669df6;"></button>
            <button class="theme-dot" data-set-accent="purple" title="Purple" style="--dot-bg: #15091f; --dot-card: #230e33; --dot-accent: #c58af9;"></button>
            <button class="theme-dot" data-set-accent="pink" title="Pink" style="--dot-bg: #200816; --dot-card: #330d23; --dot-accent: #ff8bcb;"></button>
            <button class="theme-dot" data-set-accent="red" title="Red" style="--dot-bg: #200a0a; --dot-card: #331111; --dot-accent: #f28b82;"></button>
            <button class="theme-dot" data-set-accent="orange" title="Orange" style="--dot-bg: #201208; --dot-card: #331d0d; --dot-accent: #fcad70;"></button>
            <button class="theme-dot" data-set-accent="yellow" title="Yellow" style="--dot-bg: #201a09; --dot-card: #33290e; --dot-accent: #fdd663;"></button>
            <button class="theme-dot" data-set-accent="green" title="Green" style="--dot-bg: #0f190f; --dot-card: #1a2e1a; --dot-accent: #81c995;"></button>
            <button class="theme-dot" data-set-accent="teal" title="Teal" style="--dot-bg: #001e1d; --dot-card: #003331; --dot-accent: #4db6ac;"></button>
            <button class="theme-dot" data-set-accent="cyan" title="Cyan" style="--dot-bg: #05151a; --dot-card: #164e63; --dot-accent: #06b6d4;"></button>
            <button class="theme-dot" data-set-accent="indigo" title="Indigo" style="--dot-bg: #0b0d21; --dot-card: #312e81; --dot-accent: #6366f1;"></button>
        </div>
    </aside>

    <!-- Shortcut Modal -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-box">
            <h3 id="shortcut-modal-title">Add Shortcut</h3>
            <div class="input-group">
                <input type="text" id="modal-name" placeholder="Name">
            </div>
            <div class="input-group">
                <input type="url" id="modal-url" placeholder="URL">
            </div>
            <div class="modal-actions">
                <button id="modal-delete-btn" class="btn-danger hidden" style="margin-right: auto;">Remove</button>
                <button id="modal-cancel-btn" class="btn-secondary">Cancel</button>
                <button id="modal-save-btn" class="btn-primary">Save</button>
            </div>
        </div>
    </div>

    <!-- Task Modal (ADDED THIS BACK) -->
    <div id="task-modal-overlay" class="modal-overlay hidden">
        <div class="modal-box">
            <h3>New Task</h3>
            <div class="input-group">
                <input type="text" id="task-modal-input" placeholder="What needs to be done?">
            </div>
            <div class="modal-actions">
                <button id="task-modal-cancel" class="btn-secondary">Cancel</button>
                <button id="task-modal-save" class="btn-primary">Add</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
