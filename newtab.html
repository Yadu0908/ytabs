<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>
  <link rel="icon" href="icons/favicon-dark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
</head>

<body>

  <!-- ── SETTINGS BUTTON ────────────────────────────── -->
  <button id="settings-btn" class="settings-btn" title="Settings">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
  </button>

  <!-- ── SETTINGS SIDEBAR ───────────────────────────── -->
  <div id="settings-sidebar" class="sidebar">
    <div class="sidebar-header">
      <h3>Customize</h3>
      <button id="close-sidebar" class="close-btn"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
    </div>
    
    <div class="setting-row">
      <div class="setting-info">
        <label>Rough surface</label>
        <span class="setting-desc">Adds a grainy texture to the background</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="noise-toggle" checked>
        <span class="slider round"></span>
      </label>
    </div>

    <div class="setting-row">
      <div class="setting-info">
        <label>Theme</label>
        <span class="setting-desc">Dark or Light Mode</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="theme-toggle" checked>
        <span class="slider round"></span>
      </label>
    </div>

    <div class="setting-row">
      <div class="setting-info">
        <label>Layout</label>
      </div>
      <select id="layout-select" class="sidebar-select">
        <option value="single">Single Row</option>
        <option value="wrap">Multiple Rows</option>
      </select>
    </div>

    <div class="setting-row" style="flex-direction: column; align-items: flex-start; gap: 12px;">
      <div class="setting-info">
        <label>Background Color Hue</label>
      </div>
      <input type="range" id="hue-slider" min="0" max="360" value="220" class="hue-range">
    </div>

    <div class="setting-row">
      <div class="setting-info">
        <label>Motivational Quote</label>
        <span class="setting-desc">Show quote at the bottom of the screen</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="quote-toggle" checked>
        <span class="slider round"></span>
      </label>
    </div>

    <div class="sidebar-divider"></div>
    
    <div class="sidebar-actions">
      <button id="export-btn" class="data-btn" title="Export Shortcuts (JSON)">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        <span>Export</span>
      </button>
      <button id="import-btn" class="data-btn" title="Import Shortcuts (JSON)">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        <span>Import</span>
      </button>
    </div>
  </div>

  <!-- ── SHORTCUTS ───────────────────────────────── -->
  <div class="container">
    <div id="shortcuts-grid" class="shortcuts-grid"></div>
  </div>

  <!-- ── MOTIVATIONAL QUOTE ──────────────────────── -->
  <div class="quote-container" id="quote-container">
    <p class="quote-text" id="quote-text"></p>
    <span class="quote-author" id="quote-author"></span>
  </div>

  <!-- DATA ACTIONS MOVED TO SIDEBAR -->

  <!-- ── IMPORT MODAL ──────────────────────────── -->
  <div id="import-modal-overlay" class="modal-overlay hidden">
    <div class="modal-box import-modal-box">
      <h3>Import Shortcuts</h3>
      <p class="import-desc">Select a JSON file containing your shortcuts.</p>

      <div id="drop-zone" class="drop-zone">
        <div class="upload-icon-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path>
            <path d="M12 12v9"></path>
            <path d="M16 16l-4-4-4 4"></path>
          </svg>
        </div>
        <span class="drop-text">Drag & Drop JSON file here<br>or click to browse</span>
        <input type="file" id="import-file" accept=".json"
          style="opacity:0; position:absolute; width:0; height:0; z-index:-1;" placeholder="Upload Shortcuts" />
      </div>

      <div class="modal-actions" style="justify-content:flex-end;">
        <button id="import-cancel" class="btn-stroke">Cancel</button>
      </div>
    </div>
  </div>

  <!-- ── SHORTCUT MODAL ──────────────────────────── -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-box">
      <h3>Edit shortcut</h3>
      <div class="modal-field">
        <label>Name</label>
        <input type="text" id="modal-name" autocomplete="off" />
      </div>
      <div class="modal-field">
        <label>URL</label>
        <input type="url" id="modal-url" autocomplete="off" />
      </div>
      <div class="modal-actions">
        <button id="modal-delete" class="btn-flat btn-danger">Remove</button>
        <div class="right-btns">
          <button id="modal-cancel" class="btn-stroke">Cancel</button>
          <button id="modal-save" class="btn-solid">Done</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>

</html>
